name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure a stable debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Sadiso Game Debug,O=Sadiso,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "Add stable debug keystore so debug builds share one signature [skip ci]"
            git push
          fi

      - name: Write TDLib credentials
        env:
          TD_API_ID: ${{ secrets.TD_API_ID }}
          TD_API_HASH: ${{ secrets.TD_API_HASH }}
        run: |
          {
            echo "td.api.id=$TD_API_ID"
            echo "td.api.hash=$TD_API_HASH"
          } >> local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadiso-game-debug-apk
          path: app/build/outputs/apk/debug/*.apk
